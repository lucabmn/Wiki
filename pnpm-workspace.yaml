packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
overrides:
  # Better Auth moves as one set. From 1.7.0-rc the plugins need new columns
  # (sso: account.issuer, scim: scimProvider.providerKey) and scim ships a
  # rewritten API this app is not migrated to — an upgrade is a migration, not
  # a bump. Pinning core keeps a plugin from dragging it forward on its own.
  "@better-auth/core": 1.7.0-beta.10
  brace-expansion: 5.0.8
  fast-uri: 3.1.4
  "@hocuspocus/extension-redis>ioredis": 6.0.0
  js-yaml: 5.2.2
  postcss: 8.5.18
catalog:
  dotenv: ^17.4.2
  zod: ^4.6.5
  typescript: ^7
  "@types/bun": ^1.3.14
  hono: ^4.13.13
  "@orpc/server": ^1.15.5
  "@orpc/openapi": ^1.15.5
  "@orpc/zod": ^1.15.5
  better-auth: 1.7.7
  evlog: ^2.30.1
  lucide-react: ^1.54.0
  next-themes: ^0.4.6
  react: ^19.3.0
  react-dom: ^19.3.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  "@orpc/client": ^1.15.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vitest: ^3.2.4
