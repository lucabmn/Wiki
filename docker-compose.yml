name: nilovon-wiki

# Canonical configuration lives in the root `.env` (see `.env.example`, or let
# the installer write it with strong generated secrets — download from GitHub
# Releases or run `pnpm dev:tui`). Compose interpolates it here and injects
# everything each container needs — the per-app `.env` files are only read as
# a fallback for older installs.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Runtime hardening for the three Node/Bun app containers.
#
# They already run as the unprivileged `node` user (see the Dockerfiles), bind
# ports above 1024, and touch no device — so every Linux capability can go. What
# this buys is narrow but real: a remote-code-execution bug in the app can no
# longer mount, load a module, change file ownership, or trace another process
# on its way out of the container.
#
# `no-new-privileges` is the other half: without it a setuid binary that ends up
# in a base image is a path back to root inside the namespace.
#
# Not read-only root filesystems: Node writes to `/tmp` and the SSR server
# unpacks assets under its own working directory, so a read-only root would need
# a tmpfs per path and a rebuild to verify. Capabilities are the part that is
# both safe to ship blind and worth the most.
x-app-hardening: &app-hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  # A fork bomb inside one container should not take the host's process table
  # with it. Generous — the apps run well under a hundred threads.
  pids_limit: 512

services:
  web:
    # Tagged multi-arch releases are available from GHCR for localhost installs.
    # Production custom domains rebuild web because VITE_* is baked at build time.
    image: ${WIKI_IMAGE_PREFIX:-ghcr.io/lucabmn/wiki}-web:${WIKI_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time; a domain change needs a
        # rebuild. Defaults keep plain `docker compose` on localhost.
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3000}
        VITE_COLLAB_URL: ${VITE_COLLAB_URL:-ws://localhost:1234}
    <<: *app-hardening
    init: true
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
      collab:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # One-shot: applies the versioned SQL migrations (packages/db/src/migrations)
  # before the app services start. Re-running is a no-op — applied migrations
  # are tracked in the database. Reuses the server image, so nothing extra is
  # built.
  migrate:
    image: ${WIKI_IMAGE_PREFIX:-ghcr.io/lucabmn/wiki}-server:${WIKI_VERSION:-latest}
    # The server image runs as the unprivileged `node` user. Invoke the
    # installed migration binary directly: pnpm 11 attempts to write workspace
    # metadata under root-owned /app even for `pnpm run`, which fails at runtime.
    working_dir: /app/packages/db
    <<: *app-hardening
    command: ["./node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example, or use the installer)}@postgres:5432/nilovon-wiki
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  server:
    image: ${WIKI_IMAGE_PREFIX:-ghcr.io/lucabmn/wiki}-server:${WIKI_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    <<: *app-hardening
    init: true
    # The API renders PDF exports in-process, so this is the service most likely
    # to want more. Raise it if large Space exports get killed; the per-export
    # ceilings (PDF_EXPORT_*) are what bound the demand in the first place.
    mem_limit: ${SERVER_MEMORY_LIMIT:-1g}
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (see .env.example, or use the installer)}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example, or use the installer)}@postgres:5432/nilovon-wiki
      # Reported in the admin console's instance overview — the first thing a
      # support case asks for. Mirrors the image tag.
      APP_VERSION: ${WIKI_VERSION:-dev}
      # Instance administration. Without INITIAL_ADMIN_EMAIL nobody can open
      # /admin on a fresh install; see DEPLOY.md.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      IMPERSONATION_ENABLED: ${IMPERSONATION_ENABLED:-true}
      IMPERSONATION_MAX_MINUTES: ${IMPERSONATION_MAX_MINUTES:-30}
      # Registration policy. `open` keeps the historical behaviour; a private
      # organization wiki wants `invite`. See .env.example and DEPLOY.md.
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      SIGNUP_ALLOWED_EMAIL_DOMAINS: ${SIGNUP_ALLOWED_EMAIL_DOMAINS:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      # The collab service runs in its own container, so the reachability probe
      # on the instance overview needs its address rather than loopback.
      COLLAB_INTERNAL_URL: http://collab:1234
      # Mail. Unset SMTP_HOST disables delivery, so a single-user install boots
      # without a mail server. Mail bodies are never logged; invitations and
      # password resets only reach their recipient once this points somewhere.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Wiki <no-reply@localhost>}
      # Bundled notifications. The server runs the schedule in-process; without
      # SMTP above nothing is delivered and no cursor moves, so enabling mail
      # later loses no events.
      DIGEST_SCHEDULER_ENABLED: ${DIGEST_SCHEDULER_ENABLED:-true}
      DIGEST_TICK_SECONDS: ${DIGEST_TICK_SECONDS:-300}
      # Shared bearer token for the POST /internal/…/run endpoints (digests,
      # webhooks, retention), for deployments driven by an external scheduler.
      # The digest-specific DIGEST_RUN_TOKEN is still honoured as an alias.
      INTERNAL_RUN_TOKEN: ${INTERNAL_RUN_TOKEN:-}
      DIGEST_RUN_TOKEN: ${DIGEST_RUN_TOKEN:-}
      # Outbound webhooks. Endpoints are configured per organization in the UI;
      # these only tune the runner that drains the delivery queue.
      WEBHOOK_SCHEDULER_ENABLED: ${WEBHOOK_SCHEDULER_ENABLED:-true}
      WEBHOOK_TICK_SECONDS: ${WEBHOOK_TICK_SECONDS:-30}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-6}
      WEBHOOK_ALLOW_PRIVATE_HOSTS: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
      # Data retention. The windows themselves are per-organization settings in
      # the app; this only drives the runner that enforces them. Defaults: the
      # activity log is kept forever, the trash for 30 days.
      RETENTION_SCHEDULER_ENABLED: ${RETENTION_SCHEDULER_ENABLED:-true}
      RETENTION_TICK_SECONDS: ${RETENTION_TICK_SECONDS:-3600}
      RETENTION_BATCH_LIMIT: ${RETENTION_BATCH_LIMIT:-1000}
      # Object storage for attachments — defaults to the bundled RustFS.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-nilovon-wiki}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (or use the installer)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env (or use the installer)}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Per-file upload ceiling. Uploads proxy through the API, so this also
      # bounds what one request makes the server buffer.
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-25}
      # PDF export ceilings. Rendering happens in-process, so these bound what
      # one export request may cost the API's CPU and memory.
      PDF_EXPORT_MAX_PAGES: ${PDF_EXPORT_MAX_PAGES:-500}
      PDF_EXPORT_PAGE_TIMEOUT_MS: ${PDF_EXPORT_PAGE_TIMEOUT_MS:-15000}
      PDF_EXPORT_IMAGE_CACHE_MB: ${PDF_EXPORT_IMAGE_CACHE_MB:-64}
      # Per-IP request ceilings (requests per minute).
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-60}
      RATE_LIMIT_SCIM_MAX: ${RATE_LIMIT_SCIM_MAX:-1200}
      APP_NAME: ${APP_NAME:-Wiki}
    healthcheck:
      # /health verifies database connectivity, not just process liveness.
      # Deliberately not /health/ready: that one also probes object storage and
      # the collaboration service, and neither failure is fixed by restarting
      # this container — compose would cycle a working API and take the web
      # service down with it. Point monitoring at /health/ready instead
      # (DEPLOY.md → Health & monitoring).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  collab:
    image: ${WIKI_IMAGE_PREFIX:-ghcr.io/lucabmn/wiki}-collab:${WIKI_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/collab/Dockerfile
    <<: *app-hardening
    init: true
    # Hocuspocus holds every open document in memory. Scale this with how many
    # pages are edited at once, not with the size of the wiki.
    mem_limit: ${COLLAB_MEMORY_LIMIT:-512m}
    ports:
      - "1234:1234"
    env_file:
      - path: apps/collab/.env
        required: false
    environment:
      # Shares the API server's secret to verify collaboration tokens, and the
      # same database to persist the Yjs document snapshots.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (see .env.example, or use the installer)}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example, or use the installer)}@postgres:5432/nilovon-wiki
      COLLAB_PORT: "1234"
    healthcheck:
      # WebSocket server — probe TCP accept rather than an HTTP route.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(1234,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:18
    container_name: nilovon-wiki-postgres
    # No `cap_drop: ALL` here, unlike the app containers: the official entrypoint
    # starts as root to fix ownership of the data directory and then drops to the
    # `postgres` user, which needs CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER.
    # `no-new-privileges` still applies — dropping privileges is allowed, gaining
    # them is not.
    security_opt:
      - "no-new-privileges:true"
    # A hard ceiling on the database is a trade: it stops a runaway query from
    # taking the host down, and it means the OOM killer, not Postgres, decides
    # what happens when the ceiling is reached. Sized so normal operation never
    # comes close — Postgres' own appetite is bounded by its config, not by how
    # much content the wiki holds. Raise it before you tune shared_buffers.
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    environment:
      POSTGRES_DB: nilovon-wiki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example, or use the installer)}
    ports:
      # Bound to loopback: reachable from the host (psql, backups, the TUI) but
      # never from the network. The containers talk over the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - nilovon-wiki_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # S3-compatible object storage for page attachments. The API server proxies
  # every upload and download, so this never needs to be reachable from a
  # browser — it stays on the compose network and loopback only.
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    container_name: nilovon-wiki-rustfs
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${RUSTFS_MEMORY_LIMIT:-1g}
    pids_limit: 512
    environment:
      RUSTFS_VOLUMES: /data/rustfs
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (or use the installer)}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env (or use the installer)}
    ports:
      # Loopback-only like Postgres: the compose network handles the server, and
      # the prod overlay publishes it through Caddy when browsers need it.
      - "127.0.0.1:9000:9000"
    volumes:
      - nilovon-wiki_rustfs_data:/data
    restart: unless-stopped
    logging: *default-logging

  # One-shot authenticated readiness probe and idempotent bucket bootstrap.
  # The API does not start until object storage works and its bucket exists.
  rustfs-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (or use the installer)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env (or use the installer)}
      S3_BUCKET: ${S3_BUCKET:-nilovon-wiki}
    depends_on:
      - rustfs
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        attempts=0
        until mc alias set local "$$S3_ENDPOINT" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || exit 1
          sleep 2
        done
        mc stat "local/$$S3_BUCKET" >/dev/null 2>&1 || mc mb "local/$$S3_BUCKET"
        mc stat "local/$$S3_BUCKET" >/dev/null
    restart: "no"
    logging: *default-logging

  # Backups. Opt-in:
  #   docker compose --profile backup up -d --build backup
  #
  # One run produces one *recovery set*: the database dump and every attachment
  # byte under a single timestamp, with SHA-256 checksums over both. A database
  # dump on its own restores a wiki whose attachments all 404, which is why the
  # two are no longer separate procedures.
  #
  # Attachments are mirrored through the S3 API, so nothing has to be stopped
  # for the backup to be consistent. Optional at-rest encryption and an offsite
  # copy are configured per .env; restore with
  #   docker compose --profile backup run --rm backup restore /backups/<stamp>
  # See DEPLOY.md → Backups, and scripts/backup/.
  backup:
    build:
      context: ./scripts/backup
    image: nilovon-wiki-backup:local
    container_name: nilovon-wiki-backup
    profiles: ["backup"]
    init: true
    security_opt:
      - "no-new-privileges:true"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example, or use the installer)}
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: nilovon-wiki
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # Age at which the container reports itself unhealthy. Default 36 h:
      # tolerates one late run, flags the second.
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-129600}
      # Same object store the API writes attachments to — read here, never written.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-nilovon-wiki}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (or use the installer)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env (or use the installer)}
      # Optional at-rest encryption. Store the passphrase somewhere other than
      # this host — losing it loses every backup made with it.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # Optional offsite copy (any S3-compatible target). Without it, backups
      # survive a bad deploy and nothing else.
      BACKUP_REMOTE_ENDPOINT: ${BACKUP_REMOTE_ENDPOINT:-}
      BACKUP_REMOTE_BUCKET: ${BACKUP_REMOTE_BUCKET:-}
      BACKUP_REMOTE_PREFIX: ${BACKUP_REMOTE_PREFIX:-nilovon-wiki}
      BACKUP_REMOTE_ACCESS_KEY_ID: ${BACKUP_REMOTE_ACCESS_KEY_ID:-}
      BACKUP_REMOTE_SECRET_ACCESS_KEY: ${BACKUP_REMOTE_SECRET_ACCESS_KEY:-}
    volumes:
      - nilovon-wiki_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Backup *age*, not process liveness. The failure worth catching is the
      # quiet one: the loop keeps running, the container keeps saying "Up", and
      # the dumps stopped three weeks ago because the volume filled up.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 3
      # Long enough for the first run to finish on a large install; until then
      # "no backup yet" is expected rather than a fault.
      start_period: 30m
    restart: unless-stopped
    logging: *default-logging

  # Dev-only mail catcher: `docker compose --profile dev up -d` starts it, then
  # set SMTP_HOST=mailpit / SMTP_PORT=1025 and read the mails on :8025. Never
  # enable this profile in production — it accepts mail and delivers none.
  mailpit:
    image: axllent/mailpit:latest
    container_name: nilovon-wiki-mailpit
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    logging: *default-logging

volumes:
  nilovon-wiki_postgres_data:
  nilovon-wiki_rustfs_data:
  nilovon-wiki_backups:
