# Production overlay. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The installer (GitHub-Releases binary or `pnpm dev:tui`) writes the required
# .env values; the domain vars below are prod-only and set by hand.
#
# It adds a Caddy TLS reverse proxy, stops publishing the app ports on the host
# (only Caddy is public on 80/443), and makes every service restart on boot.
#
# The public URLs are derived from WEB_DOMAIN / API_DOMAIN / COLLAB_DOMAIN in
# the root `.env`. The VITE_* vars are baked into the web bundle at build time,
# so a domain change needs a rebuild (`docker compose ... up -d --build web`).

name: nilovon-wiki

services:
  caddy:
    image: caddy:2
    init: true
    restart: always
    # Everything except the one capability a proxy on :80/:443 cannot do
    # without. Caddy also writes ACME account keys and certificates, so this is
    # not a read-only filesystem — the volumes below are exactly that state.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 512
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env for the production overlay}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env for the production overlay}
      COLLAB_DOMAIN: ${COLLAB_DOMAIN:?Set COLLAB_DOMAIN in .env for the production overlay}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env for the production overlay}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server
      - collab

  web:
    restart: always
    # Published web images target localhost. Custom-domain deployments must
    # rebuild with their VITE_* build args instead of silently pulling one.
    pull_policy: build
    # Not published on the host — reached by Caddy over the compose network.
    ports: !reset []

  server:
    restart: always
    ports: !reset []
    environment:
      # Derived from the domains so Better Auth, CORS, and Caddy can never
      # disagree about the public origins.
      CORS_ORIGIN: https://${WEB_DOMAIN}
      BETTER_AUTH_URL: https://${API_DOMAIN}
      # Not derived: WEB_DOMAIN and API_DOMAIN need not share a parent, and a
      # guessed `Domain` the browser rejects would drop the cookie outright.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

  collab:
    restart: always
    ports: !reset []

  postgres:
    restart: always

volumes:
  caddy_data:
  caddy_config:
