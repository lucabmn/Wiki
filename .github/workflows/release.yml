name: Release installer

# Builds the standalone terminal installer (apps/tui) for every supported
# platform and attaches the binaries to the GitHub release for the pushed tag.
#
# Each target builds on a runner of its own architecture instead of
# cross-compiling: @opentui/core loads a platform-specific native library via
# optionalDependencies, and only a native install has the right one on disk.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
          - os: macos-latest
            suffix: darwin-arm64
          - os: macos-15-intel
            suffix: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from the "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile installer
        working-directory: apps/tui
        run: pnpm run compile

      - name: Rename binary for platform
        run: mv apps/tui/dist/nilovon-wiki-installer nilovon-wiki-installer-${{ matrix.suffix }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: nilovon-wiki-installer-${{ matrix.suffix }}

  # Publishes runnable images so a self-hoster can `docker compose pull` instead
  # of building all three apps from source on every update.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
          - app: collab
            dockerfile: apps/collab/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The web bundle bakes its public URLs at build time, so the published
          # image only fits a deployment that uses these. Self-hosters on custom
          # domains must still build web themselves (see DEPLOY.md).
          build-args: |
            VITE_SERVER_URL=http://localhost:3000
            VITE_COLLAB_URL=ws://localhost:1234
