name: Release installer

# Builds the standalone terminal installer (apps/tui) for every supported
# platform and attaches the binaries to the GitHub release for the pushed tag.
#
# Each target builds on a runner of its own architecture instead of
# cross-compiling: @opentui/core loads a platform-specific native library via
# optionalDependencies, and only a native install has the right one on disk.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: 1
      SKIP_ENV_VALIDATION: 1
      VITE_SERVER_URL: http://localhost:3000
      VITE_COLLAB_URL: ws://localhost:1234
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release candidate
        run: |
          npx oxlint
          npx oxfmt --check
          pnpm turbo run check-types test build --force
          pnpm audit --prod --audit-level high

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
          - os: macos-latest
            suffix: darwin-arm64
          - os: macos-15-intel
            suffix: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from the "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile installer
        working-directory: apps/tui
        run: pnpm run compile

      - name: Rename binary for platform
        run: mv apps/tui/dist/nilovon-wiki-installer nilovon-wiki-installer-${{ matrix.suffix }}

      - name: Stage installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.suffix }}
          path: nilovon-wiki-installer-${{ matrix.suffix }}
          if-no-files-found: error

  # Publishes runnable images so a self-hoster can `docker compose pull` instead
  # of building all three apps from source on every update.
  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
          - app: collab
            dockerfile: apps/collab/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Immutable staging tags keep failed matrix runs from partially
          # replacing release tags or latest. The publish job promotes all
          # three only after every image and installer has succeeded.
          tags: ghcr.io/nilovon/wiki-${{ matrix.app }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The web bundle bakes its public URLs at build time, so the published
          # image only fits a deployment that uses these. Self-hosters on custom
          # domains must still build web themselves (see DEPLOY.md).
          build-args: |
            VITE_SERVER_URL=http://localhost:3000
            VITE_COLLAB_URL=ws://localhost:1234

  publish:
    needs: [build, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote all container images
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stable=false
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && stable=true
          # Validate the complete set before changing any public tag.
          for app in web server collab; do
            docker buildx imagetools inspect "ghcr.io/nilovon/wiki-$app:staging-$GITHUB_SHA" >/dev/null
          done
          for app in web server collab; do
            image="ghcr.io/nilovon/wiki-$app"
            tags=(-t "$image:$version")
            if $stable; then
              major="${version%%.*}"
              remainder="${version#*.}"
              minor="${remainder%%.*}"
              tags+=(-t "$image:$major.$minor" -t "$image:$major" -t "$image:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "$image:staging-$GITHUB_SHA"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: installers/*
