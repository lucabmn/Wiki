name: Release installer

# Builds the standalone terminal installer (apps/tui) for every supported
# platform and attaches the binaries to the GitHub release for the pushed tag.
#
# Each target builds on a runner of its own architecture instead of
# cross-compiling: @opentui/core loads a platform-specific native library via
# optionalDependencies, and only a native install has the right one on disk.

on:
  push:
    tags:
      - "v*"

# Least privilege at the top, widened per job. Only `publish` writes releases
# and only the image jobs write packages; a build job that can push a tag is a
# credential nobody needed to hand out.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      SKIP_ENV_VALIDATION: 1
      VITE_SERVER_URL: http://localhost:3000
      VITE_COLLAB_URL: ws://localhost:1234
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release candidate
        run: |
          npx oxlint
          npx oxfmt --check
          pnpm turbo run check-types test build --force
          pnpm audit --prod --audit-level high

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
          - os: macos-latest
            suffix: darwin-arm64
          - os: macos-15-intel
            suffix: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Signs a provenance statement for the binary this job produced, tying it
      # to this workflow, this commit and this runner. Without it "download the
      # installer and run it as root" is an act of faith.
      id-token: write
      attestations: write
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from the "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile installer
        working-directory: apps/tui
        run: pnpm run compile

      - name: Rename binary for platform
        run: mv apps/tui/dist/nilovon-wiki-installer nilovon-wiki-installer-${{ matrix.suffix }}

      # Signed here rather than in `publish`: provenance is only worth anything
      # if it is produced by the job that actually did the build, on the runner
      # that did it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: nilovon-wiki-installer-${{ matrix.suffix }}

      - name: Stage installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.suffix }}
          path: nilovon-wiki-installer-${{ matrix.suffix }}
          if-no-files-found: error

  # Publishes runnable images so a self-hoster can `docker compose pull` instead
  # of building all three apps from source on every update.
  images:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      # BuildKit attaches an in-toto provenance statement and an SPDX SBOM to
      # each image below; pushing those to GHCR needs the OIDC identity.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
            runner: ubuntu-latest
            platforms: linux/amd64,linux/arm64
            suffix: ""
            qemu: true
          - app: collab
            dockerfile: apps/collab/Dockerfile
            runner: ubuntu-latest
            platforms: linux/amd64,linux/arm64
            suffix: ""
            qemu: true
          # Building Vite under QEMU can hang while rendering chunks. Build the
          # web image once per native architecture and combine it in publish.
          - app: web
            dockerfile: apps/web/Dockerfile
            runner: ubuntu-latest
            platforms: linux/amd64
            suffix: -amd64
            qemu: false
          - app: web
            dockerfile: apps/web/Dockerfile
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
            suffix: -arm64
            qemu: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          # Immutable staging tags keep failed matrix runs from partially
          # replacing release tags or latest. The publish job promotes all
          # three only after every image and installer has succeeded.
          tags: ghcr.io/lucabmn/wiki-${{ matrix.app }}:staging-${{ github.sha }}${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.app }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}${{ matrix.suffix }}
          # Attached to the image manifest itself, so they survive the retagging
          # in `publish` and travel with a `docker pull` rather than living in a
          # release page somebody has to remember to check.
          #   provenance mode=max — full build definition, not just the digest
          #   sbom               — SPDX inventory of what ended up in the layers
          provenance: mode=max
          sbom: true
          # The web bundle bakes its public URLs at build time, so the published
          # image only fits a deployment that uses these. Self-hosters on custom
          # domains must still build web themselves (see DEPLOY.md).
          build-args: |
            VITE_SERVER_URL=http://localhost:3000
            VITE_COLLAB_URL=ws://localhost:1234

  publish:
    needs: [build, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # Needed for the source SBOM below — the installers alone do not describe
      # what went into them.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # Without this there is no way to tell a truncated download from a
      # tampered one, and "curl | chmod +x | run as root" is the documented
      # install path.
      - name: Checksum the installers
        working-directory: installers
        run: |
          set -euo pipefail
          sha256sum nilovon-wiki-installer-* > SHA256SUMS
          cat SHA256SUMS

      # An inventory of the dependency tree behind this tag. When the next
      # advisory lands, this answers "are we affected, and since when" without
      # rebuilding a six-month-old commit.
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: nilovon-wiki-sbom.spdx.json
          output-file: installers/nilovon-wiki-sbom.spdx.json

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote all container images
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stable=false
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && stable=true
          # Validate the complete set before changing any public tag.
          for app in server collab; do
            docker buildx imagetools inspect "ghcr.io/lucabmn/wiki-$app:staging-$GITHUB_SHA" >/dev/null
          done
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "ghcr.io/lucabmn/wiki-web:staging-$GITHUB_SHA-$arch" >/dev/null
          done
          docker buildx imagetools create \
            -t "ghcr.io/lucabmn/wiki-web:staging-$GITHUB_SHA" \
            "ghcr.io/lucabmn/wiki-web:staging-$GITHUB_SHA-amd64" \
            "ghcr.io/lucabmn/wiki-web:staging-$GITHUB_SHA-arm64"
          for app in web server collab; do
            image="ghcr.io/lucabmn/wiki-$app"
            tags=(-t "$image:$version")
            if $stable; then
              major="${version%%.*}"
              remainder="${version#*.}"
              minor="${remainder%%.*}"
              tags+=(-t "$image:$major.$minor" -t "$image:$major" -t "$image:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "$image:staging-$GITHUB_SHA"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Installers, their SHA256SUMS, and the SBOM.
          files: installers/*
          body: |
            ## Verifying this release

            Checksums, and provenance signed by the workflow that built each binary:

            ```sh
            sha256sum -c SHA256SUMS --ignore-missing
            gh attestation verify nilovon-wiki-installer-linux-x64 --repo ${{ github.repository }}
            ```

            Container images carry their own provenance and an SPDX SBOM in the
            manifest:

            ```sh
            gh attestation verify oci://ghcr.io/lucabmn/wiki-server:${{ github.ref_name }} --repo ${{ github.repository }}
            docker buildx imagetools inspect ghcr.io/lucabmn/wiki-server:${{ github.ref_name }} --format '{{ json .SBOM }}'
            ```

            See [DEPLOY.md](https://github.com/${{ github.repository }}/blob/main/DEPLOY.md#verifying-a-release)
            and the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          append_body: true
          generate_release_notes: true
