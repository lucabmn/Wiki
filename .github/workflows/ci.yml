name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes anything. `GITHUB_TOKEN` defaults to whatever the
# repository setting says, which on an older repository is read *and* write for
# every scope — and this workflow runs code from pull requests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # CI has no .env files; skip t3-env runtime validation and provide the
      # one public variable the web build bakes in.
      SKIP_ENV_VALIDATION: 1
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from the "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx oxlint

      - name: Format check
        run: npx oxfmt --check

      - name: Typecheck, test, build
        run: pnpm turbo run check-types test build

      # Reported, not gated: a fresh advisory against a transitive dependency
      # would otherwise redden every unrelated pull request. Read the step
      # output; act on it in a dedicated bump.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      # The compose stack builds three images; a broken Dockerfile is otherwise
      # only discovered at deploy time.
      - name: Build container images
        run: |
          docker build -f apps/server/Dockerfile -t nilovon-wiki-server .
          docker build -f apps/collab/Dockerfile -t nilovon-wiki-collab .
          docker build -f apps/web/Dockerfile \
            --build-arg VITE_SERVER_URL=http://localhost:3000 \
            --build-arg VITE_COLLAB_URL=ws://localhost:1234 \
            -t nilovon-wiki-web .
