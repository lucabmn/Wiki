name: Publish container images

# Builds the three service images (web, server, collab) and pushes them to the
# GitHub Container Registry so a self-hosted install can `docker compose pull`
# instead of building locally.
#
# Multi-arch (amd64 + arm64) is built on native runners rather than under QEMU:
# the web/server bundles run pnpm + vite/bun, which are painfully slow and
# OOM-prone emulated. Each (app, arch) pair pushes a by-digest image; a per-app
# merge job then stitches the digests into one multi-arch manifest tag.
#
# NOTE: the web image bakes VITE_SERVER_URL / VITE_COLLAB_URL at build time, so
# the published image targets localhost only. A custom-domain production install
# must still build web locally (`docker compose ... up -d --build web`). See
# DEPLOY.md.
#
# ONE-TIME after the first successful run: GHCR creates each package private,
# even for a public repo. A maintainer must set wiki-web / wiki-server /
# wiki-collab to public in the org package settings, or anonymous
# `docker compose pull` returns 403.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Repo is Nilovon/Wiki; GHCR names must be lowercase.
  IMAGE_PREFIX: ghcr.io/nilovon/wiki

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [web, server, collab]
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          # Localhost defaults for the published web image; ignored by the
          # server/collab Dockerfiles (undeclared build args are harmless).
          build-args: |
            VITE_SERVER_URL=http://localhost:3000
            VITE_COLLAB_URL=ws://localhost:1234
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.platform.arch }}
          # Push an untagged, by-digest image; the merge job assembles the tags.
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, server, collab]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.app }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            # `latest` only on a semver tag, never on a main push.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}-${{ matrix.app }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ steps.meta.outputs.version }}
