name: Feature request
description: Suggest an idea or enhancement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search [existing issues](https://github.com/Nilovon/Wiki/issues) first, and for larger changes open an issue to discuss before sending a PR.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What are you trying to do that you can't today?
      placeholder: "I'm frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the project would this touch?
      multiple: true
      options:
        - Web app (apps/web)
        - Server (apps/server)
        - Terminal UI (apps/tui)
        - API / business logic (packages/api)
        - Auth / permissions (packages/auth)
        - Database / schema (packages/db)
        - UI components (packages/ui)
        - Build / tooling / CI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, prior art, or anything else that helps explain the request.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I'd be willing to help implement this.
          required: false
