name: Bug report
description: Report a defect or unexpected behavior
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search [existing issues](https://github.com/Nilovon/Wiki/issues) first to avoid duplicates.

        > Do **not** report security vulnerabilities here — see [SECURITY.md](https://github.com/Nilovon/Wiki/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reliably reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, logs, or screenshots.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the project does this affect?
      multiple: true
      options:
        - Web app (apps/web)
        - Server (apps/server)
        - Terminal UI (apps/tui)
        - API / business logic (packages/api)
        - Auth / permissions (packages/auth)
        - Database / schema (packages/db)
        - UI components (packages/ui)
        - Build / tooling / CI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant versions and platform.
      placeholder: |
        - OS: macOS 15.4
        - Node: 22.x
        - pnpm: 10.32.1
        - Browser (if web): Chrome 130
        - Deployment: local dev / Docker Compose / other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — related PRs, recent changes, workarounds.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest `main`.
          required: false
